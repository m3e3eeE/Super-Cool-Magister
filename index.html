
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FakeHack Simulator v5</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #050805;
      color: #00ff41;
      font: 17px Consolas, "Courier New", monospace;
    }

    #terminal {
      padding: 24px;
      min-height: 100vh;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #warning {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #f4f4f4;
      color: #222;
      width: min(460px, 90vw);
      padding: 25px;
      border-top: 6px solid #d22;
      box-shadow: 0 0 90px #ff222255;
      font: 16px Arial, sans-serif;
      z-index: 10;
    }

    #warning h2 { color: #ba2222; }

    #progress {
      height: 14px;
      background: #ddd;
      margin: 20px 0;
    }

    #bar {
      width: 0%;
      height: 100%;
      background: #d22;
      transition: width 0.3s;
    }

    button {
      padding: 10px 18px;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
      background: #263744;
      color: white;
    }
  </style>
</head>

<body>
  <div id="terminal">FAKEHACK v5 - SECURITY SIMULATION
Initializing virtual environment...</div>

  <div id="warning">
    <h2>⚠ Security Alert</h2>
    <p>Suspicious remote connection detected.</p>
    <p>Checking simulated firewall activity...</p>
    <div id="progress"><div id="bar"></div></div>
    <p><strong>Demo alert — not a real Windows warning.</strong></p>
    <button id="closeButton">Close simulation</button>
  </div>

  <script>
    // All effects are visual only.
    // No real scans, network requests, or file access.

    const terminal = document.getElementById("terminal");
    const warning = document.getElementById("warning");
    const bar = document.getElementById("bar");
    const closeButton = document.getElementById("closeButton");

    let finished = false;
    let line = 0;
    let progress = 0;

    const messages = [
      "Loading virtual security modules...",
      "[OK] Diagnostic interface loaded",
      "Generating simulation session...",
      "[OK] Session established",
      "Checking virtual firewall rules...",
      "Reading simulated packet headers...",
      "Analyzing encrypted data blocks...",
      "[ALERT] Unknown virtual connection",
      "Preparing demonstration warning..."
    ];

    function print(message) {
      terminal.textContent += "\n" + message;
      window.scrollTo(0, document.body.scrollHeight);
    }

    function finish() {
      if (finished) return;
      finished = true;
      clearInterval(messageTimer);
      clearInterval(progressTimer);

      warning.style.display = "none";
      terminal.textContent =
        "====================================\n" +
        "          YOU GOT PRANKED!\n" +
        "====================================\n\n" +
        "Nothing was hacked.\n" +
        "No files or passwords were accessed.\n" +
        "No network connection was made.\n\n" +
        "This was just a browser animation :)";
    }

    closeButton.addEventListener("click", finish);

    let progressTimer;

    function showWarning() {
      warning.style.display = "block";

      progressTimer = setInterval(function () {
        if (finished) return;

        progress += 10;
        bar.style.width = progress + "%";

        if (progress >= 100) {
          clearInterval(progressTimer);
          setTimeout(finish, 1000);
        }
      }, 350);
    }

    const messageTimer = setInterval(function () {
      if (finished) return;

      if (line < messages.length) {
        const randomCode =
          Math.floor(Math.random() * 0xFFFFFF)
            .toString(16)
            .toUpperCase()
            .padStart(6, "0");

        print("[0x" + randomCode + "] " + messages[line]);
        line++;
      } else {
        clearInterval(messageTimer);
        showWarning();
      }
    }, 700);
  </script>
</body>
</html>
