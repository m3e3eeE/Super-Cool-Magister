
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Simulation</title>
<style>
  body {
    margin: 0;
    background: #050805;
    color: #00ff41;
    font: 16px Consolas, monospace;
  }

  #terminal {
    padding: 25px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #warning {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(430px, 85vw);
    background: #f4f4f4;
    color: #171717;
    border-top: 5px solid #c53030;
    padding: 25px;
    font: 16px Arial, sans-serif;
    box-shadow: 0 0 80px #e22a2a55;
  }

  button {
    padding: 10px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="terminal">INITIALIZING SECURITY SIMULATION...</div>

<div id="warning">
  <h2>⚠ Security Alert</h2>
  <p>Suspicious remote connection detected.</p>
  <p>Analyzing simulated security event...</p>
  <p><strong>Training simulation — no real threat.</strong></p>
  <button onclick="finish()">Close simulation</button>
</div>

<script>
const terminal = document.getElementById("terminal");
const warning = document.getElementById("warning");

const messages = [
  "Loading security modules...",
  "Establishing simulated connection...",
  "SESSION AUTHENTICATED",
  "Scanning virtual sectors...",
  "Analyzing encrypted blocks...",
  "Checking firewall rules...",
  "WARNING: UNKNOWN CONNECTION DETECTED",
  "Preparing security alert..."
];

let running = true;

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function start() {
  for (const message of messages) {
    if (!running) return;
    await wait(1000);
    if (!running) return;
    terminal.textContent += "\n" + message;
  }

  warning.style.display = "block";
  await wait(5000);

  if (running) finish();
}

function finish() {
  running = false;
  warning.style.display = "none";
  document.body.style.background = "#050805";
  terminal.textContent =
    "Thanks for your info.:)\n\n" +
    
}

start();
</script>
</body>
</html>
